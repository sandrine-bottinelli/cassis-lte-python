# .github/workflows/release.yml
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.4.0.dev0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for uv-dynamic-versioning to see tags
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
